services:

  backend:
    build: ./apps
    restart: always #autorunning container
    links:
      - db
    ports:
      - "3000"
    environment:
                - DB_NAME=${db-name}
                - DB_HOST=${db-host}
                - DB_USER=${db-user}
                - DB_PASS=${db-pass}
                - APP_PORT=${app-port}
    volumes:
      - app-data:/apps/public/images

  db:
    image: "mariadb"
    restart: always
    links:
      - phpmyadmin
    ports:
      - "3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${db-pass}
      - MYSQL_DATABASE=${db-name}
      - MYSQL_USER=${db-user}
      - MYSQL_PASSWORD=${db-pass}
    volumes:
      - ./apps/database/:/docker-entrypoint-initdb.d
      - db-data:/var/lib/mysql

  phpmyadmin:
    image: "phpmyadmin"
    restart: always
    ports:
      - "7080:80"
    environment:
      - PMA_HOST=db

  web:
    build: ./nginx
    restart: always
    ports:
    - "80:80"
    depends_on:
    - backend

volumes:
  app-data:
  db-data: